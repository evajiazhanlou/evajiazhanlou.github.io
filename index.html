<style>
:root{
  /* ---------- 字体（只改这里）---------- */
  --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;   /* 名字、大标题 */
  --font-body:    "Figtree", "Helvetica Neue", Arial, system-ui, sans-serif; /* 正文 */
  --font-hand:    "Caveat", "Bradley Hand", "Segoe Print", cursive;        /* 手写标签 */
  --size-name: clamp(72px, 10vw, 148px);
  --size-body: 17px;

  --bg:#ECEDE9; --paper:#FAFAF7; --ink:#1F1B17; --soft:#5F5A52; --line:#D6D6CF;
  --red:#B32A2A; --wood:#8A5A3B; --tag:#FFFEFA; --wash:#F3E7E3;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17140F; --paper:#211D17; --ink:#EEE8DE; --soft:#B3AA9C; --line:#3A342B; --red:#E2574C; --wood:#C28F67; --tag:#FFFEFA; --wash:#2E211C; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#17140F; --paper:#211D17; --ink:#EEE8DE; --soft:#B3AA9C; --line:#3A342B; --red:#E2574C; --wood:#C28F67; --tag:#FFFEFA; --wash:#2E211C; color-scheme:dark; }

*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 var(--size-body)/1.6 var(--font-body)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--red);outline-offset:3px;border-radius:6px}

/* ---------- Layout ---------- */
.page{max-width:1240px;margin:0 auto;padding:48px 28px 56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:center;min-height:100vh}
.left{display:flex;flex-direction:column;gap:22px}
.kicker{font:700 26px/1 var(--font-hand);color:var(--red);transform:rotate(-2deg);transform-origin:left}
.name{font:400 var(--size-name)/.9 var(--font-display);letter-spacing:-.02em;margin:0;display:flex;flex-wrap:nowrap;white-space:nowrap}
.name .ch{position:relative;display:inline-block;transition:margin .5s cubic-bezier(.3,1.6,.5,1)}
.name .ch .t{display:inline-block;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .25s}
.name .ch .d{position:absolute;left:50%;top:50%;width:1em;height:1em;transform:translate(-50%,-46%) scale(0) rotate(-20deg);transition:transform .55s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.name .ch .d svg{width:100%;height:100%;stroke:var(--red);fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.name .ch.on{margin:0 .08em}
.name .ch.on .t{transform:scale(.2);opacity:0}
.name .ch.on .d{transform:translate(-50%,-46%) scale(.95) rotate(0)}
.name .sp{display:inline-block;width:.28em}
.pitch{font:400 clamp(26px,2.6vw,34px)/1.2 var(--font-display);margin:0;max-width:22ch}
.bio{color:var(--soft);margin:0;max-width:48ch}
.legend{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--line)}
.legend li{border-bottom:1px solid var(--line)}
.legend button{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;background:none;border:0;padding:11px 2px;cursor:pointer;text-align:left}
.legend button:hover .what,.legend button.lit .what{color:var(--red)}
.legend .ico svg{width:28px;height:28px;stroke:var(--red);fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.legend .what{font-weight:600;transition:color .2s}
.legend .obj{font:600 20px/1 var(--font-hand);color:var(--soft)}
.cvbtn{align-self:flex-start;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 20px;font-weight:600;cursor:pointer}
.cvbtn:hover{background:var(--red);color:#fff}

/* ---------- Photo ---------- */
.right{display:flex;justify-content:center}
.print{position:relative;width:min(100%,calc((100vh - 96px) * .75));aspect-ratio:3/4;background:#fff;padding:12px 12px 46px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 24px 50px rgba(40,30,20,.18);transform:rotate(1.2deg)}
.photo{position:relative;width:100%;height:100%;overflow:hidden;background:#d9cfc2}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .9s ease}
.photo img#photo-img{opacity:0;transition:opacity .5s ease,filter .9s ease}
.photo img#photo-img.ready{opacity:1}
.photo.off img{filter:brightness(.42) saturate(.6)}
.dim{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(circle at var(--x,50%) var(--y,50%),transparent 0,transparent 15%,rgba(25,18,12,.45) 38%)}
.photo.focus:not(.off) .dim{opacity:1}
.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ink .pen{fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.ink .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ink g.grp{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.ink g.grp.lift .pen{stroke-width:6}
.tag rect{fill:var(--tag);stroke:rgba(0,0,0,.08)}
.tag text{font:700 30px var(--font-hand);fill:#1F1B17}
.ink .tag{opacity:0;animation:fade .5s ease forwards}
@keyframes fade{to{opacity:1}}
.hot{position:absolute;border:0;background:transparent;border-radius:50%;cursor:pointer;transform:translate(-50%,-50%)}
.hot span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.caption{position:absolute;left:0;right:0;bottom:12px;text-align:center;font:600 22px/1 var(--font-hand);color:#5F5A52;white-space:nowrap}

/* sun switch */
.sun{position:absolute;top:-30px;left:-30px;z-index:5;width:76px;height:76px;border-radius:50%;border:0;background:var(--paper);box-shadow:0 6px 18px rgba(40,30,20,.22);cursor:pointer;display:grid;place-items:center;padding:0;transform:rotate(-1.2deg)}
.sun svg{width:58px;height:58px;stroke:var(--red);fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.sun .core{transition:fill .4s}
.sun[aria-pressed="true"] .core{fill:var(--red)}
.sun[aria-pressed="true"] svg{transform:rotate(45deg)}
.sun[aria-pressed="false"] svg{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-14deg)}86%{transform:rotate(12deg)}94%{transform:rotate(-6deg)}}
.hint{position:absolute;top:-34px;left:56px;z-index:5;font:700 26px/1 var(--font-hand);color:var(--red);white-space:nowrap;transform:rotate(-3deg);pointer-events:none;transition:opacity .4s}
.hint svg{width:46px;height:30px;stroke:var(--red);fill:none;stroke-width:3;stroke-linecap:round;vertical-align:-10px;margin-right:4px}
.hint.gone{opacity:0}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,15,10,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:var(--sw,min(100%,clamp(560px,54vw,800px)));max-width:100%;background:var(--paper);z-index:50;transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px)}
.sheet.open{transform:none}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:30px 40px 8px}
.sheet .sk{font:700 24px/1 var(--font-hand);color:var(--red);margin-bottom:6px}
.sheet h2{font:400 46px/1 var(--font-display);margin:0}
.x{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:none;cursor:pointer;font-size:22px;line-height:1;flex-shrink:0}
.x:hover{border-color:var(--ink)}
.body{overflow-y:auto;padding:14px 40px calc(48px + env(safe-area-inset-bottom,0px));flex:1}
.body p{margin:0 0 12px}
.muted{color:var(--soft)}
.see{border:0;background:none;padding:0;margin-top:8px;cursor:pointer;font:700 21px/1.1 var(--font-hand);color:var(--red);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}

/* work */
.wg{margin-top:26px}
.wg:first-child{margin-top:4px}
.wg h3.gh{font:700 30px/1 var(--font-hand);color:var(--red);margin:0 0 4px}
.wg .gn{color:var(--soft);font-size:15px;margin:0 0 6px}
.case{border-top:1px solid var(--line);padding:18px 0;scroll-margin-top:12px}
.case.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--wash)}100%{background:transparent}}
.case .k{font-size:14px;font-weight:600;color:var(--soft)}
.case h4{font:400 29px/1.1 var(--font-display);margin:4px 0 8px}
.case .n{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.case .n b{font:400 40px/1 var(--font-display);color:var(--red)}
.case .st{display:inline-block;font:700 20px/1 var(--font-hand);color:var(--red);border:1.5px solid var(--red);border-radius:999px;padding:5px 12px 3px;transform:rotate(-2deg)}
.case details{margin-top:10px}
.case summary{cursor:pointer;font-weight:600;font-size:15px}
.case dl{margin:10px 0 0;display:grid;gap:8px}
.case dt{font-weight:600;font-size:14px}
.case dd{margin:0;color:var(--soft)}
.case .lead{color:var(--soft);margin:0}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.figs figure{margin:0}
.figs button{display:block;width:100%;padding:8px;background:#fff;border:1px solid var(--line);cursor:zoom-in;transform:rotate(-.6deg);box-shadow:0 6px 16px rgba(40,30,20,.12)}
.figs figure:nth-child(2) button{transform:rotate(.8deg)}
.figs img{display:block;width:100%;height:auto}
.figs figcaption{font-size:13px;color:var(--soft);margin-top:8px}

/* shells */
.shells{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.shell{perspective:800px;border:0;background:none;padding:0;cursor:pointer;height:236px;text-align:left}
.shell .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.shell[aria-pressed="true"] .in{transform:rotateY(180deg)}
.shell .f,.shell .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:16px;display:flex;flex-direction:column;border:1.5px solid var(--line);background:var(--bg)}
.shell .f svg{width:76px;height:76px;stroke:var(--red);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;margin:2px 0 8px}
.shell .f .o{font:600 20px/1 var(--font-hand);color:var(--soft)}
.shell .f .h{font-weight:600;font-size:18px;margin-top:4px;word-break:break-word}
.shell .b{transform:rotateY(180deg);background:var(--ink);color:var(--bg);border-color:var(--ink);justify-content:space-between}
.shell .b p{margin:0;font-size:15px;line-height:1.45}
.shell .b .see{color:var(--bg);font-size:20px;align-self:flex-start}
.shell .b .see:hover{color:var(--red)}

/* now */
.upd{display:inline-block;font:700 21px/1 var(--font-hand);color:var(--red);border:1.5px solid var(--red);border-radius:999px;padding:6px 13px 4px;transform:rotate(-2deg);margin:0 0 12px}
.brews{display:grid;gap:0;margin-top:6px}
.brew{border-top:1px solid var(--line);padding:14px 0}
.brew h3{font:400 24px/1.15 var(--font-display);margin:0 0 4px}
.brew p{margin:0;color:var(--soft);font-size:15px}
.lk.ph{border-style:dashed;color:var(--soft);font-weight:500}
/* journey */
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px dashed var(--line)}
.tl li{position:relative;padding:0 0 20px}
.tl li::before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2.5px solid var(--line)}
.tl .w{font:700 20px/1 var(--font-hand);color:var(--soft)}
.tl h3{font:400 22px/1.15 var(--font-display);margin:4px 0}
.tl p{margin:0;color:var(--soft);font-size:15px}
.tl .see{font-size:19px}
.tl li.nb::before{display:none}
.tl p.dl{display:flex;gap:10px;align-items:baseline;color:var(--ink);margin-top:6px}
.dlab{flex-shrink:0;font:700 19px/1 var(--font-hand);color:var(--red);border-bottom:1.5px solid var(--red);transform:rotate(-2deg)}
.nbk{border:1.5px dashed var(--line);border-radius:18px;padding:14px 16px 2px;margin:2px 0 4px}
.tl .nbk h3.gh{font:700 26px/1 var(--font-hand);color:var(--red);margin:0 0 4px}
.tl .nbk .gn{color:var(--soft);font-size:15px;margin:0 0 6px}
.nbk .case:first-of-type{border-top:0}
.nbk .case h4{font-size:24px}
.hsbc{position:relative;margin:4px 0 22px;border:2px solid var(--red);border-radius:20px;padding:20px 22px 6px;background:var(--wash)}
.hsbc .hn{font:400 64px/.9 var(--font-display);color:var(--red);margin:0}
.hsbc .hr{font-weight:600;margin:8px 0 0}
.hsbc .hw{color:var(--soft);font-size:15px;margin:0 0 16px}
.hsbc .tl{border-left-color:var(--red)}
.hsbc .tl li::before{border-color:var(--red)}
.hsbc .tl li.cur::before{background:var(--red)}
.hsbc .tl .w{color:var(--red)}
.hsbc .tl h3{font-size:26px}
.tl li.nx::before{border-style:dashed;border-color:var(--red)}
.tl li.nx .w{color:var(--red)}

/* life */
.life{display:grid;gap:14px}
.hob{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start;border-top:1px solid var(--line);padding-top:14px}
.hob svg{width:56px;height:56px;stroke:var(--red);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.hob h3{font:400 24px/1 var(--font-display);margin:2px 0 6px}
.hob p{margin:0;color:var(--soft);font-size:15px}

/* contact */
.links{display:grid;gap:10px;margin-top:16px}
.lk{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--ink);border-radius:14px;padding:14px 16px;text-decoration:none;font-weight:600}
.lk:hover{background:var(--ink);color:var(--bg)}
.lk.main{background:var(--red);border-color:var(--red);color:#fff}

/* cv */
.cv h3{font:400 24px/1.1 var(--font-display);margin:22px 0 8px;color:var(--red);display:flex;align-items:center;gap:10px}
.cv h3::before{content:"";width:12px;height:12px;border-radius:50%;background:currentColor;flex-shrink:0}
.cv ul{margin:0;padding:10px 14px 6px 30px;border-left:3px solid var(--red);background:var(--wash);border-radius:0 12px 12px 0}
.cv li{margin-bottom:6px}
.cv h3:nth-of-type(3){color:var(--wood)} .cv ul:nth-of-type(3){border-left-color:var(--wood);background:transparent;border:1.5px solid var(--line);border-left:3px solid var(--wood)}
.cv h3:nth-of-type(4){color:var(--soft)} .cv ul:nth-of-type(4){border-left-color:var(--line);background:transparent}

/* zoom */
.zoom{position:fixed;inset:0;z-index:70;background:rgba(20,15,10,.82);display:none;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));cursor:zoom-out}
.zoom.open{display:flex}
.zoom img{max-width:100%;max-height:100%;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.4)}

/* sheet grips */
.sheet.dragging{transition:none}
.grip-x{position:absolute;left:-11px;top:0;bottom:0;width:22px;cursor:ew-resize;touch-action:none;display:flex;align-items:center;justify-content:center;z-index:2}
.grip-x::after{content:"";width:5px;height:64px;border-radius:3px;background:var(--line);transition:background .2s,height .2s}
.grip-x:hover::after,.grip-x:focus-visible::after,.sheet.dragging .grip-x::after{background:var(--red);height:96px}
.grip-y{display:none}

/* edit mode */
.edbar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:60;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:5px;box-shadow:0 8px 24px rgba(40,30,20,.16)}
.edbar[hidden]{display:none}
.edbar button{border:0;background:none;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.edbar button:hover{background:var(--bg)}
.edbar .ed-main{background:var(--ink);color:var(--bg)}
.edbar .ed-main:hover{background:var(--red);color:#fff}
.ed-on{display:none;gap:4px;align-items:center}
body.editing .ed-on{display:flex}
.ed-save{position:relative}
.ed-menu{position:absolute;top:calc(100% + 10px);left:0;display:flex;flex-direction:column;min-width:270px;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 14px 34px rgba(40,30,20,.2)}
.ed-menu[hidden]{display:none}
.ed-menu button{text-align:left;border-radius:10px;padding:10px 12px}
.ed-menu small{display:block;font-weight:400;color:var(--soft);font-size:12.5px}
#ed-discard{color:var(--red)}
body.editing .page{padding-top:84px}
body.editing [data-k][contenteditable="true"]{outline:1.5px dashed var(--line);outline-offset:3px;border-radius:4px;cursor:text;min-width:1.5em}
body.editing [data-k][contenteditable="true"]:hover{outline-color:var(--soft)}
body.editing [data-k][contenteditable="true"]:focus{outline:2px solid var(--red)}
body.editing [data-k]:empty::before{content:attr(data-ph);color:var(--soft);opacity:.55;font-style:italic}
body.editing .shell{height:auto;min-height:250px}
body.editing .shell .in{transform-style:flat}
body.editing .shell .f,body.editing .shell .b{position:relative;inset:auto;transform:none;backface-visibility:visible}
body.editing .shell .b{margin-top:8px}
body.editing .shell[aria-pressed="true"] .in{transform:none}
.ed-photo{display:none;position:absolute;right:16px;top:16px;z-index:4;border:0;border-radius:999px;background:var(--paper);color:var(--ink);padding:9px 14px;font-size:14px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
body.editing .ed-photo{display:block}
.ed-swap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.figs button{position:relative}
body.editing .figs button{cursor:pointer}
.ed-note{font-size:14px;margin-top:12px}
.fs{border:1.5px solid var(--line);border-radius:14px;padding:10px 14px 14px;margin:0 0 14px}
.fs legend{font:700 22px/1 var(--font-hand);color:var(--red);padding:0 6px}
.fld{display:grid;gap:4px;margin-top:10px}
.fld span{font-size:13px;font-weight:600;color:var(--soft)}
.fld input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.fld input:focus{outline:2px solid var(--red);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:80;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:1.5px solid var(--bg);background:none;color:var(--bg);border-radius:999px;padding:5px 12px;font-weight:600;cursor:pointer;flex-shrink:0}

@media (max-width:900px){
  .page{grid-template-columns:1fr;gap:34px;padding-top:28px;min-height:0}
  .right{order:2}
  .print{width:100%;transform:none;padding:8px 8px 40px}
  .left{display:contents}
  .head{order:1}
  .legendwrap{order:3}
  .caption{font-size:18px;bottom:10px}
  .sun{top:-18px;left:-12px;width:64px;height:64px}
  .sun svg{width:48px;height:48px}
  .hint{top:-26px;left:58px;font-size:23px}
  .sheet{top:auto;height:92vh;width:100%;border-radius:22px 22px 0 0;transform:translateY(102%)}
  .grip-x{display:none}
  .grip-y{display:block;height:24px;flex-shrink:0;touch-action:none;cursor:grab}
  .grip-y::after{content:"";display:block;width:46px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0}
  .sheet header{touch-action:none}
  .edbar{left:8px;right:8px;border-radius:20px;justify-content:center}
  .edbar button{padding:8px 11px}
  .ed-menu{left:auto;right:0}
  body.editing .page{padding-top:76px}
  .sheet header{padding:6px 22px 8px}
  .sheet h2{font-size:38px}
  .body{padding:12px 22px calc(40px + env(safe-area-inset-bottom,0px))}
  .shells{grid-template-columns:1fr 1fr}
  .shell{height:250px}
  .hsbc{padding:18px 16px 4px}
}
@media (max-width:420px){ .shells{grid-template-columns:1fr} .shell{height:200px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} .ink .draw{stroke-dashoffset:0} .ink .tag{opacity:1} }
</style>
</head>
<body>
<main class="page">
  <div class="left">
    <div class="head" style="display:flex;flex-direction:column;gap:20px">
      <div class="kicker" id="kicker"></div>
      <h1 class="name" id="name" aria-label="Eva Lou"></h1>
      <p class="pitch" id="pitch"></p>
      <p class="bio" id="bio"></p>
      <button class="cvbtn" id="cvbtn" type="button"></button>
    </div>
    <div class="legendwrap" style="display:flex;flex-direction:column;gap:18px">
      <ul class="legend" id="legend"></ul>
    </div>
  </div>

  <div class="right">
    <figure class="print" style="margin:0">
      <button class="sun" id="sun" type="button" aria-pressed="false" aria-label="Turn the light on"></button>
      <div class="hint" id="hint" aria-hidden="true"></div>
      <div class="photo off" id="photo">
        <img id="photo-img" alt="A sunlit table on a wooden porch, with a basket of paper bags, glass jars and wooden chairs.">
        <div class="dim"></div>
        <svg class="ink" id="ink" viewBox="0 0 1000 1333" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
      </div>
      <figcaption class="caption" id="caption"></figcaption>
      <button class="ed-photo" id="ed-photo" type="button">Replace photo</button>
    </figure>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
  <div class="grip-x" id="grip-x" role="separator" aria-orientation="vertical" aria-label="Drag to resize. Double-click to reset." tabindex="0"></div>
  <div class="grip-y" id="grip-y" aria-hidden="true"></div>
  <header><div><div class="sk" id="sheet-k"></div><h2 id="sheet-title"></h2></div><button class="x" id="close" type="button" aria-label="Close">×</button></header>
  <div class="body" id="sheet-body"></div>
</aside>
<div class="edbar" id="edbar" hidden="">
  <button type="button" id="ed-toggle" class="ed-main" aria-pressed="false">Edit page</button>
  <span class="ed-on"><button type="button" id="ed-labels">Labels and links</button>
  <span class="ed-save"><button type="button" id="ed-savebtn" aria-expanded="false" aria-controls="ed-menu">Save</button>
    <span class="ed-menu" id="ed-menu" hidden="">
      <button type="button" id="ed-export">Export published page<small>index.html, editing switched off, for GitHub</small></button>
      <button type="button" id="ed-copy">Download editable copy<small>keep this one for yourself</small></button>
      <button type="button" id="ed-discard">Discard all unsaved edits</button>
    </span></span></span>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filepick" accept="image/jpeg,image/png,image/webp" hidden="">
<div class="zoom" id="zoom" role="dialog" aria-label="Enlarged image"><img id="zoom-img" alt=""></div>

});

const ink=$('ink'); const NS='http://www.w3.org/2000/svg';
function wobbleEllipse(cx,cy,rx,ry,seed){ let d='',n=28; for(let i=0;i<=n+3;i++){ const a=i/n*Math.PI*2+seed; const k=1+Math.sin(i*1.7+seed*3)*0.04; const x=cx+Math.cos(a)*rx*k, y=cy+Math.sin(a)*ry*k*(1+i/(n*14)); d+=(i?' L':'M')+x.toFixed(1)+' '+y.toFixed(1);} return d; }
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||ink).appendChild(e);return e}
function pen(d,g,delay){ const p=el('path',{d,class:'pen draw',pathLength:1},g); p.style.animationDelay=delay+'s'; return p; }
function tag(g,x,y,text,rot,delay){ const t=el('g',{class:'tag',transform:`translate(${x} ${y}) rotate(${rot})`},g); t.style.animationDelay=delay+'s';
  const w=String(text).length*14+34; el('rect',{x:-w/2,y:-24,width:w,height:46,rx:6},t); const tx=el('text',{x:0,y:9,'text-anchor':'middle'},t); tx.textContent=text; return t; }
function shellPath(cx,cy,s,rot,kind){ const c=Math.cos(rot),sn=Math.sin(rot); const P=(x,y)=>[cx+(x*c-y*sn)*s, cy+(x*sn+y*c)*s].map(v=>v.toFixed(1)).join(' ');
  if(kind==='spiral'){ let d=''; for(let i=0;i<=46;i++){ const th=i/46*Math.PI*4.2, r=.06+.17*th/Math.PI; d+=(i?' L':'M')+P(Math.cos(th)*r*.9,Math.sin(th)*r*.75);} return d+' L'+P(.2,.85)+' L'+P(-.55,.8); }
  let d=`M${P(0,.68)} C${P(-.62,.64)} ${P(-.92,.18)} ${P(-.84,-.2)} C${P(-.72,-.62)} ${P(.72,-.62)} ${P(.84,-.2)} C${P(.92,.18)} ${P(.62,.64)} ${P(0,.68)} Z`;
  [[-.55,-.35],[-.22,-.55],[.22,-.55],[.55,-.35]].forEach(q=>{d+=` M${P(0,.68)} Q${P(q[0]*.6,.1)} ${P(q[0],q[1])}`}); return d; }
function mugPath(x,y,s){ const f=(a,b)=>`${(x+a*s).toFixed(1)} ${(y+b*s).toFixed(1)}`;
  return `M${f(-.5,-.4)} L${f(-.44,.5)} Q${f(-.43,.6)} ${f(-.32,.6)} L${f(.32,.6)} Q${f(.43,.6)} ${f(.44,.5)} L${f(.5,-.4)} Z M${f(.48,-.18)} Q${f(.85,-.2)} ${f(.8,.1)} Q${f(.76,.35)} ${f(.45,.3)} M${f(-.2,-.55)} Q${f(-.28,-.75)} ${f(-.18,-.92)} M${f(0,-.55)} Q${f(-.08,-.8)} ${f(.04,-1)} M${f(.2,-.55)} Q${f(.12,-.75)} ${f(.22,-.92)}`; }

const sheet=$('sheet'), scrim=$('scrim'), sBody=$('sheet-body'), sk=$('sheet-k'), st=$('sheet-title');
let lastFocus=null, isOpen=false, current=null;
function openSheet(id,from,afterRender){
  const [kPath,tPath,html]=RENDER[id](); if(!isOpen) lastFocus=from||document.activeElement; current=id;
  if(id==='labels'){ sk.removeAttribute('data-k'); st.removeAttribute('data-k'); sk.textContent='only you see this'; st.textContent='Labels and links'; }
  else { sk.dataset.k=kPath; st.dataset.k=tPath; sk.innerHTML=getP(C,kPath)||''; st.innerHTML=getP(C,tPath)||''; }
  sBody.innerHTML=html; sBody.scrollTop=0;
  sBody.querySelectorAll('.shell').forEach(b=>{ const flip=e=>{ if(e.target.closest('.see')||(editing&&e.target.closest('[contenteditable="true"]'))) return; b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'); };
    b.addEventListener('click',flip); b.addEventListener('keydown',e=>{ if(e.target!==b) return; if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(e); } }); });
  if(editing){ armEditables(sheet); }
  sheet.classList.add('open'); scrim.classList.add('open'); sheet.setAttribute('aria-hidden','false'); isOpen=true;
  if(afterRender) afterRender(); else setTimeout(()=>$('close').focus(),50);
}
function goTo(spec){
  const [where,cid]=spec.split(':');
  if(where==='journey'){ openSheet('journey'); return; }
  const inNB=(C.journey.notebook&&C.journey.notebook.cases||[]).some(c=>c.id===cid);
  openSheet(inNB?'journey':'work',null,()=>{ const a=$('case-'+cid); if(!a) return; const d=a.querySelector('details'); if(d) d.open=true;
    requestAnimationFrame(()=>{ a.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'}); a.classList.add('flash'); const s=a.querySelector('summary'); s&&s.focus({preventScroll:true}); }); });
}
sBody.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ goTo(g.dataset.go); return; }
  const z=e.target.closest('[data-zoom]'); if(z){
    if(editing){ pickImage(z.dataset.zoom); return; }
    $('zoom-img').src=IMG[z.dataset.zoom]; $('zoom-img').alt=z.querySelector('img').alt; $('zoom').classList.add('open'); }
});

function closeSheet(){ sheet.classList.remove('open'); scrim.classList.remove('open'); sheet.setAttribute('aria-hidden','true'); isOpen=false; current=null; lastFocus&&lastFocus.focus(); }

/* ======= sheet: drag the edge to resize (desktop), drag down to close (phone) ======= */
const narrow=matchMedia('(max-width:900px)');
try{ const w=localStorage.getItem('eva-sheet-w'); if(w) sheet.style.setProperty('--sw',w+'px'); }catch(e){}
(function(){
  const gx=$('grip-x');
  gx.addEventListener('pointerdown',e=>{ if(narrow.matches) return; e.preventDefault(); gx.setPointerCapture(e.pointerId); sheet.classList.add('dragging');
    const move=ev=>{ const w=Math.round(Math.min(innerWidth*.94,Math.max(380,innerWidth-ev.clientX))); sheet.style.setProperty('--sw',w+'px'); };
    const up=()=>{ sheet.classList.remove('dragging'); gx.removeEventListener('pointermove',move); gx.removeEventListener('pointerup',up);
      try{ localStorage.setItem('eva-sheet-w',parseInt(getComputedStyle(sheet).width)); }catch(e){} };
    gx.addEventListener('pointermove',move); gx.addEventListener('pointerup',up); });
  gx.addEventListener('dblclick',()=>{ sheet.style.removeProperty('--sw'); try{ localStorage.removeItem('eva-sheet-w'); }catch(e){} });
  gx.addEventListener('keydown',e=>{ if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return; e.preventDefault(); const w=parseInt(getComputedStyle(sheet).width)+(e.key==='ArrowLeft'?40:-40); sheet.style.setProperty('--sw',Math.min(innerWidth*.94,Math.max(380,w))+'px'); });
  const startY=(e)=>{ if(!narrow.matches) return; if(e.target.closest('button,[contenteditable="true"]')) return;
    const y0=e.clientY; let dy=0; const t=e.currentTarget; t.setPointerCapture(e.pointerId); sheet.classList.add('dragging');
    const move=ev=>{ dy=Math.max(0,ev.clientY-y0); sheet.style.transform=`translateY(${dy}px)`; };
    const up=()=>{ sheet.classList.remove('dragging'); sheet.style.transform=''; t.removeEventListener('pointermove',move); t.removeEventListener('pointerup',up); t.removeEventListener('pointercancel',up); if(dy>110) closeSheet(); };
    t.addEventListener('pointermove',move); t.addEventListener('pointerup',up); t.addEventListener('pointercancel',up); };
  $('grip-y').addEventListener('pointerdown',startY);
  sheet.querySelector('header').addEventListener('pointerdown',startY);
})();

  <fieldset class="fs"><legend>Page</legend>${f('Browser tab title','home.title')}${f('Short-version button','home.cvButton')}${f('Hint next to the sun','home.sunHint')}${f('Photo caption','home.caption')}</fieldset>
  <fieldset class="fs"><legend>Links</legend>${f('Email','contact.email','email')}${f('LinkedIn URL (leave empty to hide)','contact.linkedin','url')}</fieldset>
  <p class="muted">To change the big photo, use “Replace photo” on the photo itself. To change a picture inside a sheet, click the picture.</p>`;
}
let redrawTm;
document.addEventListener('input',e=>{
  if(!editing) return;
  const ce=e.target.closest&&e.target.closest('[data-k][contenteditable="true"]');
  if(ce){ const k=ce.dataset.k; setP(C,k,clean(ce.innerHTML));
    if(k.startsWith('spots.')) renderStatic();
    changed(); return; }
  const inp=e.target.closest&&e.target.closest('[data-in]');
  if(inp){ setP(C,inp.dataset.in,inp.value.trim()); renderStatic();
    if(lit){ clearTimeout(redrawTm); redrawTm=setTimeout(drawAll,500); }
    changed(); }
});
document.addEventListener('keydown',e=>{ if(editing&&e.key==='Enter'&&e.target.closest&&e.target.closest('[contenteditable="true"]')){ e.preventDefault(); e.target.blur(); } });
document.addEventListener('paste',e=>{ const ce=e.target.closest&&e.target.closest('[contenteditable="true"]'); if(!ce) return; e.preventDefault();
  const txt=(e.clipboardData||window.clipboardData).getData('text/plain').replace(/\s*\n\s*/g,' '); document.execCommand('insertText',false,txt); });

/* image replacement: shrink to at most 1800 px so the page stays light */
function pickImage(key){
  const inp=$('filepick'); inp.value='';
  inp.onchange=()=>{ const file=inp.files[0]; if(!file) return;
    const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{
      const max=1800, sc=Math.min(1,max/Math.max(im.width,im.height)); const cv=document.createElement('canvas');
      cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc); cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      IMG[key]=cv.toDataURL('image/jpeg',.84); changedImg.add(key);
      document.querySelectorAll(`img[data-imgkey="${key}"]`).forEach(x=>x.src=IMG[key]); if(key==='photo') $('photo-img').src=IMG.photo;
      changed(); toast('Image replaced.'); };
      im.onerror=()=>toast('This image format can’t be opened here. Save it as JPG or PNG first (iPhone HEIC photos need converting).');
      im.src=fr.result; }; fr.readAsDataURL(file); };
  inp.click();
}

/* export: rebuild this same file with the new text and images */
function jsSafe(o,indent){ return JSON.stringify(o,null,indent).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029'); }
function buildFile(editable){
  const doc=new DOMParser().parseFromString(SRC,'text/html');
  doc.querySelectorAll('.eva-fontcss').forEach(e=>e.remove());
  doc.getElementById('eva-mode').textContent='\nvar EVA_EDITABLE = '+(editable?'true':'false')+';   /* true = 编辑版（左上角有 Edit page）；false = 发布版 */\n';
  doc.getElementById('eva-content').textContent='\n/* 网站文字。推荐在编辑版网页上点 Edit page 直接改；也可以在这里改（引号里的文字）。 */\nvar CONTENT = '+jsSafe(C,2)+';\n';
  doc.getElementById('eva-img').textContent='\nvar EVA_IMG = '+jsSafe(IMG)+';\n';
  return '<!DOCTYPE html>\n'+doc.documentElement.outerHTML;
}
function download(name,text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/html'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); }

if(EDITABLE){
  const bar=$('edbar'); bar.hidden=false;
  const tg=$('ed-toggle'), menuBtn=$('ed-savebtn'), menu=$('ed-menu');
  function setEditing(on){
    editing=on; document.body.classList.toggle('editing',on); tg.textContent=on?'Done':'Edit page'; tg.setAttribute('aria-pressed',on);
    if(on){ armEditables(document.querySelector('.head')); } else { disarm(); }
    if(isOpen&&current){ const keep=sBody.scrollTop; openSheet(current); sBody.scrollTop=keep; }
  }
  tg.onclick=()=>setEditing(!editing);
  $('ed-labels').onclick=()=>{ if(!editing) setEditing(true); openSheet('labels',$('ed-labels')); };
  $('ed-photo').onclick=()=>pickImage('photo');
  menuBtn.onclick=()=>{ const open=menu.hidden; menu.hidden=!open; menuBtn.setAttribute('aria-expanded',open); };
  document.addEventListener('click',e=>{ if(!menu.hidden&&!e.target.closest('.ed-save')){ menu.hidden=true; menuBtn.setAttribute('aria-expanded','false'); } });
  $('ed-export').onclick=()=>{ menu.hidden=true; download('index.html',buildFile(false)); toast('Downloaded index.html: the published page, with editing switched off.'); };
  $('ed-copy').onclick=()=>{ menu.hidden=true; download('eva-site-editor.html',buildFile(true)); toast('Downloaded eva-site-editor.html: keep this one to edit next time.'); };
  $('ed-discard').onclick=()=>{ menu.hidden=true; if(confirm('Discard all edits saved in this browser and go back to the file as it was?')){ try{ localStorage.removeItem('eva-site-draft-v5'); }catch(e){} location.reload(); } };
  /* restore a draft from last time */
  try{ const raw=localStorage.getItem('eva-site-draft-v5'); if(raw){ const d=JSON.parse(raw);
    Object.keys(d.c||{}).forEach(k=>C[k]=d.c[k]); Object.keys(d.img||{}).forEach(k=>{ IMG[k]=d.img[k]; changedImg.add(k); }); renderStatic();
    toast('Restored the edits you made last time in this browser.','Discard',()=>{ localStorage.removeItem('eva-site-draft-v5'); location.reload(); }); } }catch(e){}
}
})();
</script></body></html>
